name: build

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish a release as (e.g. v0.1.0). Leave blank to just build."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif printf '%s' "$HEAD_MSG" | grep -q '\[release\]' && [[ -f RELEASE_VERSION ]]; then
            TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          if [[ "$TAG" == v* ]]; then
            echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev libfreetype6-dev \
            libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev xvfb

      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-src-8.0.14-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTEAL1176_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/dsp_offline_test
          xvfb-run -a ./build/plugin_host_test

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "packaging\windows\installer.iss"

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TEAL1176-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            build/TEAL1176_artefacts/Release/VST3/**
            build/TEAL1176_artefacts/Release/AU/**
            build/TEAL1176_artefacts/Release/Standalone/**

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TEAL1176-Windows-Installer
          if-no-files-found: error
          path: dist/*.exe

  release:
    needs: build
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir -p dist
          cd artifacts
          for d in */; do
            name="${d%/}"
            case "$name" in
              *Installer*) continue ;;        # the installer is attached directly
            esac
            zip -r "../dist/${name}.zip" "$name"
          done
          cd ..
          find artifacts -name '*.exe' -exec cp {} dist/ \;
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TEAL 1176 ${{ steps.meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true
